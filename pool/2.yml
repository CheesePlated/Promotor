name: Imperative Business
text: |
  Amend rule 2449 (Winning the Game) by replacing the text "The Herald is then authorized to award those persons the Patent Title of Champion once, by announcement." with "The Herald CAN once by announcement, and SHALL in a timely fashion, award those persons the Patent Title of Champion."

  [As it stands now, if the Herald is AWoL this can't be deputized for.]
