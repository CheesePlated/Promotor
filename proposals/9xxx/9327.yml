text: |
  Amend Rule 2608 (The Notary) by replacing this text:

        1. every pledge, along with its title, creator, time window, time
           of creation, and time of expiry;

  With this text:

        1. every pledge, along with its title, creator, time window, time
           of creation, time of expiry, and infraction class;

  According to rule 2450 (Pledges), breaking a pledge can be an infraction of varying class depending on the value stated while making the pledge. It seems silly to leave this information out of the report
