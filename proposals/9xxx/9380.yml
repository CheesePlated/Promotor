name: intsallation instructions
text: |
  Amend Rule 1006 (Offices) by replacing the first paragraph with the following:

  {
  An Office is a position described as an Office by the Rules. Officeholder is an office switch tracked by the ADoP, with possible values of any player or "vacant" (default). Each instance of the Officeholder switch is secured at the power of the Rule defining the associated office (or the power of this Rule, if the defining Rule's power is higher). To install a player into an office is to flip that office's Officeholder switch to that player. An officer is the holder of an office, who may be referred to by the name of that office.
  }

  [Added the second-to-last sentence since there doesn't seem to be any definition of what installing someone into an office actually does at the moment. This shouldn't have any gamestate ramifications though since officeholder self-ratifies through R2698]
