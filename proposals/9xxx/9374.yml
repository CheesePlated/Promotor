name: Tying Up White Ribbons
text: |
  Amend Rule 2438 ("Ribbons") by replacing the following text:
  ---
  White (W): A player qualifies for a White Ribbon if e has never previously owned a White Ribbon (including under previous rulesets). A player who has been registered for the past 30+ days or 180+ cumulative days and has never acted on eir own behalf to cause another person to gain a White Ribbon (including under a previous ruleset) CAN act on eir own behalf to cause another person to earn a White Ribbon by announcement.
  ---

  With the following text:
  ---
  White (W): A player qualifies for a White Ribbon if e has never previously owned a White Ribbon (including under previous rulesets). A player who has been registered for the past 30+ days or 180+ cumulative days and has never acted on eir own behalf to cause another person to earn or gain a White Ribbon (including under a previous ruleset) CAN act on eir own behalf to cause another person to earn a White Ribbon by announcement.
  ---

  [The current version of White Ribbons has a possible loophole: players "gift" White Ribbons by causing other players to EARN White Ribbons, and then in response Rule 2438 itself causes the earning player to GAIN a White Ribbon. However, the "you can only do this once" clause only checks to see if the player has previously directly caused another player to gain a White Ribbon. You could argue that the current mechanism counts, because there's a clear chain of causality from earning to gaining, but given the technical nature of the language here I think there's definitely a case to be made that the blocking clause simply doesn't work as-is. The "gain" wording is kept in to make sure everyone who was already blocked is still blocked.]
