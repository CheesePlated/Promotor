name: Counter-revolution Mk II
text: |
  [Includes a carveout for R2486 as suggested by qenya, unless the would-be duumvirate tries to exploit it.]

  Repeal any rule titled "Purchased Re-enactment"

  Repeal any rule that includes this {}-delimited text in its body (whitespace and case insensitive:

  {
  For the purpose of this rule, a proposal or former proposal is an
  "adopted proposal" if any past referendum on that proposal or former
  proposal had an outcome oF ADOPTED.

  A player CAN revive an adopted proposal by paying a fee of 25
  Spendies. When a player does so, this rule performs the same rules
  changes that that adopted proposal would perform if it took effect
  right now.
  }

  Repeal any rule that includes "Janet" or "ais523" in its body (case insensitive), except for rule 2486 if its body is exactly identical to its body as of the beginning of this year.
