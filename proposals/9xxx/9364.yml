name: Sysphyean Effort
text: |
  Amend Rule 2683 ("The Boulder") by appending the following paragraph:
  ---
  Once per week, each player who has pushed the boulder exactly once that week can pay a fee of X spendies, where X is equal to 10 plus the Boulder's Slope, to push the boulder a second time.
  ---
