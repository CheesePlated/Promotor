name: Season Specification
text: |
  Amend Rule 2710 ("Genetic Modification") by replacing the first paragraph with the following text:
  ---
  Once per Crop Season, a player CAN pay a fee of 500 Pyrite to create a new type of Crop, specifying its name and, optionally, its Growth Season. The Land Managor CAN once by announcement, and SHALL in a timely fashion, set its Seed Cost, Growth Duration, Resilience, Opportunity, and Sell Price to randomly selected valid values, as well as its Growth Season if none was specified. The Land Managor CAN by announcement rename a type of Crop, specifying its new name, but SHOULD NOT do so unless its current name is reasonably likely to cause confusion and delay.
  ---
