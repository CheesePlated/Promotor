name: Even Fewer Cretan Applications
text: |
  Amend rule 2240 "No Cretans Need Apply" by replacing "Rule" with "rule, contract, or regulation" wherever it appears.

  (Comment: For avoidance of doubt when it comes to rule-like objects, whether or not Galle's CFJ is determined to be a problem. The replacement language is attested in Rule 1586 "Definition and Continuity of Entities")
