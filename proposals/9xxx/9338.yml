name: Claim of Error Withdrawal
text: |
  Amend Rule 2201, "Self-Ratification", by inserting the following paragraph immediately before the final paragraph:
  ---
  As long as the publisher of the original document has not yet responded in any of the above ways, the issuer of a doubt CAN, by announcement, withdraw the doubt, causing it to cease to be a doubt. The above notwithstanding, the publisher of the original document NEED NOT respond to a withdrawn doubt.
  ---
