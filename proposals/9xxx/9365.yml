name: Unique CFJ IDs v2
text: |
  > Amend Rule 991 ("Calls for Judgement") by replacing the eighth paragraph with the following text:
  > ---
  > If a CFJ does not have a unique CFJ ID number, the Arbitor CAN by announcement or by clear specification assign an ID number to it, and SHALL do so in any message in which e assigns a player to judge it.
  > ---
