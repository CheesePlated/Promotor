name: Self-Scampering
text: |
  Amend Rule 2701 ("Stamp Scamp") by replacing the word "another" with "a".

  [Inspired by mischief's recent attempt to grant emself a stamp; I honestly don't see any reason why this power should not be usable on oneself, an extra stamp per quarter is hardly going to break anything.]
