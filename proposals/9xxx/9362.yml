id: '9362'
name: Rebalanced Operands
text: |
  Create a new power 1 rule, entitled "Operators", with the following text:
  ---
  Operator is a player switch, tracked by the Numerator, with values Sum (default), Difference, and Product.

  Once per month, a player CAN flip eir Operator by announcement.
  ---

  Amend rule 2714 ("Spending Number Cards") by replacing the second paragraph with the following text:
  ---
  For any two decimal digits X and Y (which may be the same), a player CAN:

  * If eir Operator is Product, pay 5 spendies, an X card, and a Y card to grant emself a number card with a type equal to the last digit of the product X * Y.
  * If eir Operator is Sum, pay 6 spendies, an X card, and a Y card to grant emself a number card with a type equal to the last digit of the sum X + Y.
  * If eir Operator is Difference, pay 8 spendies, an X card, and a Y card to grant emself a number card with a type equal to the last digit of the difference X - Y.
  ---
