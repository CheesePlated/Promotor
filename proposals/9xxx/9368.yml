name: Greater Genetic Mutation v3
text: |
  Amend Rule 2710 ("Genetic Modification") by replacing the fourth paragraph with the following text:
  ---
  Once per Crop Season, the Land Managor CAN and SHALL by announcement set a randomly selected attribute (Seed Cost, Growth Duration, Opportunity, Resilience, or Sell Price) of a randomly selected type of Crop that was in-season during the previous season to a randomly selected valid value. If there is no such type to select, then e SHALL instead announce that fact.
